[project]
name = "bthr-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.20,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "tzdata>=2025.1", "jsonschema>=4,<5", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "PyYAML>=6,<7",
  "langgraph>=1,<2", "langchain>=1,<2", "langchain-anthropic>=1,<2",
  "langchain-openai>=1,<2", "langchain-ollama>=1,<2", "pillow>=11,<13",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bthr_agent"]
