services:
  # Local PostgreSQL instance for development and CI
  postgres:
    image: postgres:17-alpine
    container_name: findatabase-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flyway Migrations
  # Connects to the local postgres service defined above
  findatabase:
    build:
      context: .
      dockerfile: Dockerfile
    image: findatabase
    container_name: findatabase
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
      - FLYWAY_SCHEMAS=public,finance,plan,investment,reporting
      - FLYWAY_DEFAULT_SCHEMA=public
      - FLYWAY_CREATE_SCHEMAS=true
    volumes:
      - ./migrations:/flyway/sql
      - ./flyway.toml:/flyway/conf/flyway.toml
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
