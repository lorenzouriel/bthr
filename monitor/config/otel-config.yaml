extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/browser:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  resource/browser:
    attributes:
      - {key: service.name, value: bthr.Web, action: upsert}
      - {key: service.namespace, value: bthr, action: upsert}
      - {key: service.instance.id, value: "${env:WEB_INSTANCE}", action: upsert}
      - {key: service.version, value: "${env:SERVICE_VERSION}", action: upsert}
      - {key: environment, value: "${env:ENVIRONMENT}", action: upsert}
      - {key: deployment.environment.name, value: "${env:ENVIRONMENT}", action: upsert}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
    sending_queue: {enabled: true, queue_size: 1000}
    retry_on_failure: {enabled: true, max_elapsed_time: 300s}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: {enabled: true, queue_size: 1000}
    retry_on_failure: {enabled: true, max_elapsed_time: 300s}
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion: {enabled: true}
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, resource/browser, batch]
      exporters: [otlp/tempo]
    logs/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, resource/browser, batch]
      exporters: [otlphttp/loki]
    metrics/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, resource/browser, batch]
      exporters: [prometheus]
