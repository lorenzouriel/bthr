limit_req_zone $binary_remote_addr zone=telemetry:10m rate=10r/s;
map $http_origin $telemetry_origin_allowed {
    default 0;
    "" 1;
    "http://localhost:8080" 1;
    "http://127.0.0.1:8080" 1;
}
# Never log URLs, query strings, cookies, headers, or client addresses.
log_format safe_access '$request_method status=$status duration=$request_time';
server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log safe_access;
    error_log /var/log/nginx/error.log crit;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        access_log off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location ~ ^/telemetry/v1/(traces|metrics|logs)$ {
        if ($telemetry_origin_allowed = 0) { return 403; }
        limit_except POST { deny all; }
        limit_req zone=telemetry burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        client_body_timeout 5s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        rewrite ^/telemetry/(.*)$ /$1 break;
        proxy_pass http://otel-collector:4319;
    }
    location /telemetry/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
